# CI for the Godot/C# port living in ported/.
#
# WHY THIS FILE EXISTS AT THE REPO ROOT:
# GitHub Actions only reads workflows from .github/workflows/ at the repository
# root. ported/.github/workflows/ci.yml is invisible to GitHub while ported/ is a
# subdirectory — it becomes the live workflow the moment ported/ is extracted into
# its own repository (ported/PORT_PLAN.md §11). Until then, this file is the one
# that runs. Keep the two in sync.

name: ported CI

on:
  push:
    paths: ['ported/**', '.github/workflows/ported-ci.yml']
  pull_request:
    paths: ['ported/**', '.github/workflows/ported-ci.yml']
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ported-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: ported

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build + test on every target platform, and emit the determinism fingerprint.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-14,       name: macos-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # NOTE: `with:` paths are relative to the workspace root, NOT to
          # defaults.run.working-directory. Hence the ported/ prefix here but
          # not in the run: steps below.
          global-json-file: ported/global.json

      # SpikePhysicsBaseline references ../../../src/Engine (the sanctioned
      # temporary escape, PORT_PLAN.md §11) so it cannot build from an extracted
      # ported/. It is excluded here to keep this workflow identical in behaviour
      # to the post-extraction one.
      - name: Restore
        run: dotnet restore AsteroidsOnSteroids.sln

      - name: Build
        run: dotnet build AsteroidsOnSteroids.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test AsteroidsOnSteroids.sln -c Release --no-build --verbosity normal

      - name: Fingerprint
        shell: bash
        run: |
          dotnet run --project tools/MathFingerprint -c Release --no-build -- --verbose \
            > "fingerprint-${{ matrix.name }}.txt" 2> "fingerprint-${{ matrix.name }}-detail.txt"
          echo "── ${{ matrix.name }} ──"
          cat "fingerprint-${{ matrix.name }}-detail.txt"
          echo "combined: $(cat fingerprint-${{ matrix.name }}.txt)"

      # The SimMath gate above covers the maths library. This one covers the solver built on it:
      # solve order, topology renumbering, and the accumulation order inside every reduction. A
      # build that agrees on the maths and disagrees here has a bug in the simulation.
      - name: Simulation fingerprint
        shell: bash
        run: |
          dotnet run --project tools/FractureBench -c Release --no-build -- --fingerprint \
            > "simprint-${{ matrix.name }}.txt" 2> "simprint-${{ matrix.name }}-detail.txt"
          echo "── ${{ matrix.name }} ──"
          cat "simprint-${{ matrix.name }}-detail.txt"
          echo "combined: $(cat simprint-${{ matrix.name }}.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.name }}
          path: |
            ported/fingerprint-${{ matrix.name }}*.txt
            ported/simprint-${{ matrix.name }}*.txt

  # ────────────────────────────────────────────────────────────────────────────
  # THE DETERMINISM GATE.
  # SimMath must produce bit-identical results on every platform. This is the only
  # mechanism that catches a stray MathF.Sin entering the sim years from now.
  # ported/PORT_PLAN.md §6, ported/PHASE0.md Deliverable 4.
  # ────────────────────────────────────────────────────────────────────────────
  determinism:
    name: determinism gate
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          merge-multiple: true

      - name: Compare fingerprints across platforms
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: strip CR before comparing. The Windows runner's .NET writes CRLF,
          # so a byte-identical hash still differs from the Linux/macOS files by a
          # trailing \r — which `sort -u` counts as a second unique line while
          # printf renders both identically. This cost one confusing red build.
          echo "Per-platform combined fingerprints:"
          for p in linux-x64 windows-x64 macos-arm64; do
            printf '  %-14s %s\n' "$p" "$(tr -d '\r' < "fingerprint-$p.txt")"
          done

          uniq_count=$(cat fingerprint-linux-x64.txt fingerprint-windows-x64.txt \
                           fingerprint-macos-arm64.txt | tr -d '\r' | sort -u | wc -l)
          if [ "$uniq_count" -ne 1 ]; then
            echo ""
            echo "::error::DETERMINISM GATE FAILED — SimMath differs across platforms."
            echo "Per-function detail (find the first function whose hash differs):"
            for f in fingerprint-*-detail.txt; do
              echo "── $f"; cat "$f"
            done
            exit 1
          fi
          echo ""
          echo "✅ All platforms agree: $(tr -d '\r' < fingerprint-linux-x64.txt)"

      - name: Compare simulation fingerprints across platforms
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-platform simulation fingerprints:"
          for p in linux-x64 windows-x64 macos-arm64; do
            printf '  %-14s %s\n' "$p" "$(tr -d '\r' < "simprint-$p.txt")"
          done

          uniq_count=$(cat simprint-linux-x64.txt simprint-windows-x64.txt \
                           simprint-macos-arm64.txt | tr -d '\r' | sort -u | wc -l)
          if [ "$uniq_count" -ne 1 ]; then
            echo ""
            echo "::error::DETERMINISM GATE FAILED — the simulation differs across platforms."
            echo "SimMath agreed, so this is the solver: solve order, topology renumbering,"
            echo "or the accumulation order inside a reduction. Per-scenario detail below —"
            echo "the first scenario that differs narrows it down."
            for f in simprint-*-detail.txt; do
              echo "── $f"; cat "$f"
            done
            exit 1
          fi
          echo ""
          echo "✅ All platforms agree: $(tr -d '\r' < simprint-linux-x64.txt)"

  # ────────────────────────────────────────────────────────────────────────────
  # INDEPENDENCE GATE — ported/PORT_PLAN.md §11.
  # ported/ must be extractable at any moment. Copy it alone into a clean
  # directory and prove it builds, tests and runs with nothing else present.
  # ────────────────────────────────────────────────────────────────────────────
  independence:
    name: independence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ported/global.json

      - name: Assert no reference escapes ported/
        run: python3 scripts/check_independence.py

      - name: Build and test from a clean extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/extracted
          cp -r . /tmp/extracted/asteroids
          cd /tmp/extracted/asteroids
          rm -rf .git
          dotnet build AsteroidsOnSteroids.sln -c Release
          dotnet test AsteroidsOnSteroids.sln -c Release --no-build
          dotnet run --project tools/MathFingerprint -c Release --no-build
          echo "✅ ported/ builds, tests and runs standalone."
